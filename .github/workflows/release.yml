name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # npm ci must not see a token that can push to main.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Must not be an npm script named "publish": npm publish runs that
          # lifecycle script and would call changeset publish a second time.
          publish: npm run release
          commit: "chore(release): version package"
          title: "chore(release): version package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node with registry-url writes .npmrc against NODE_AUTH_TOKEN.
          # An empty token makes npm return E404 on PUT (it hides 401 as 404).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
