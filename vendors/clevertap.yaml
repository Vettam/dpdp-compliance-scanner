id: clevertap
vendor: CleverTap
match:
  hosts: ["d2r1yp2w7owrrs.cloudfront.net", "wzrkt.com", "wizrocket.com", "cdn.wzrkt.com"]
  cookies: ["WZRK_G", "WZRK_S", "WZRK_L", "wiz_session_id"]
packages:
  npm: ["clevertap-web-sdk", "clevertap"]
data_points: [persistent_browser_id, page_url, event_name, ip_address, user_agent, push_token]
category: C9
flags: [3PF, XFER, KIDS, PRE, SENS]
role: independent_or_joint_fiduciary
lawful_basis: consent
provisions: ["s.6(1)", "s.9(3)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  A persistent identifier, pages visited, events, IP address, browser details
  and push token, sent to CleverTap for engagement, segmentation and push
  messaging. Inferred segments are outside s.7(a) and need consent.
destination_countries: [IN, US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Stop firing; clear WZRK_* cookies; request deletion via CleverTap."
last_verified: "2026-09-15"
provenance: direct observation
