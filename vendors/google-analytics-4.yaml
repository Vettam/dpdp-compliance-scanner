id: google-analytics-4
vendor: Google
match:
  hosts: ["www.google-analytics.com", "region1.google-analytics.com", "analytics.google.com", "ssl.google-analytics.com"]
  cookies: ["_ga", "_ga_*"]
packages:
  npm: ["@google-analytics/data"]
data_points: [persistent_browser_id, page_url, ip_address, user_agent, event_name, traffic_source]
category: C4
flags: [3PF, XFER, PRE]
role: processor_or_3pf
lawful_basis: consent
provisions: ["s.6(1)", "s.8(2)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  A persistent browser identifier (_ga), the pages you visit, your IP address,
  browser and device details, and traffic source, sent to Google Analytics 4
  for measurement. Per-user analytics is processing of personal data and needs
  consent; aggregate-only cookieless counting may qualify for the s.17(2)(b)
  statistics exemption.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Stop firing; clear _ga cookies; request deletion via Google's user-deletion tools."
last_verified: "2026-09-15"
provenance: direct observation
