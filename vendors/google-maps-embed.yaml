id: google-maps-embed
vendor: Google
match:
  hosts: ["maps.googleapis.com", "www.google.com/maps", "maps.google.com", "maps.gstatic.com"]
  cookies: ["NID", "SID", "PREF"]
data_points: [ip_address, user_agent, page_url, persistent_browser_id, location_query]
category: C7
flags: [3PF, XFER, PRE, SENS]
role: independent_or_joint_fiduciary
lawful_basis: consent
provisions: ["s.6(1)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  IP address, browser details, the embedding page URL and a Google browser
  identifier, shared with Google when a Maps embed loads. The location query
  may itself reveal where the visitor is.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Use a click-to-load facade; do not embed until the visitor clicks."
last_verified: "2026-09-15"
provenance: direct observation
