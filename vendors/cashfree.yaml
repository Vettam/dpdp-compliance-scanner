id: cashfree
vendor: Cashfree
match:
  hosts: ["sdk.cashfree.com", "api.cashfree.com", "payments.cashfree.com", "www.cashfree.com"]
  cookies: ["cashfree_*"]
packages:
  npm: ["cashfree-pg", "@cashfreepayments/cashfree-js"]
  composer: ["cashfree/cashfree-pg"]
data_points: [device_id, card_data, payment_metadata, ip_address, user_agent]
category: C8
flags: [3PF, XFER, SENS]
role: fiduciary
lawful_basis: s7a
provisions: ["s.16(2)", "s.8(2)", "s.8(5)", "Rule 6(1)"]
notice_itemisation: >
  Card and bank data (sent to Cashfree), a device identifier, payment metadata,
  IP address and browser details, for processing a payment. RBI payment-data
  localisation survives under s.16(2).
destination_countries: [IN]
fires_pre_consent_by_default: false
withdrawal_mechanism: "Offload payment to Cashfree; do not retain card data yourself."
last_verified: "2026-09-17"
provenance: vendor documentation
