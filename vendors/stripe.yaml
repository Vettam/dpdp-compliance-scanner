id: stripe
vendor: Stripe
match:
  hosts: ["js.stripe.com", "api.stripe.com", "m.stripe.com", "m.stripe.network"]
  cookies: ["__stripe_mid", "__stripe_sid"]
packages:
  npm: ["stripe", "@stripe/stripe-js", "@stripe/react-stripe-js"]
  pypi: ["stripe"]
  maven: ["com.stripe:stripe-java"]
  go: ["github.com/stripe/stripe-go", "github.com/stripe/stripe-go/v82"]
  rubygems: ["stripe"]
  cocoapods: ["Stripe"]
  composer: ["stripe/stripe-php"]
data_points: [device_id, card_data, payment_metadata, ip_address, user_agent]
category: C8
flags: [3PF, XFER, SENS]
role: fiduciary
lawful_basis: s7a
provisions: ["s.16(2)", "s.8(2)", "s.8(5)", "Rule 6(1)"]
notice_itemisation: >
  Card and bank data (sent to Stripe), a device identifier, payment metadata,
  IP address and browser details, for processing a payment.
destination_countries: [US]
fires_pre_consent_by_default: false
withdrawal_mechanism: "Offload payment to Stripe; do not retain card data yourself."
last_verified: "2026-09-15"
provenance: direct observation
