id: posthog
vendor: PostHog
match:
  hosts: ["app.posthog.com", "us.i.posthog.com", "eu.i.posthog.com", "posthog.com"]
  cookies: ["ph_*"]
  storage_keys: ["ph_*"]
packages:
  npm: ["posthog-js", "posthog-node", "@posthog/react"]
  pypi: ["posthog"]
  go: ["github.com/posthog/posthog-go"]
  rubygems: ["posthog-ruby"]
  cocoapods: ["PostHog"]
  composer: ["posthog/posthog-php"]
data_points: [persistent_browser_id, page_url, event_name, ip_address, user_agent, traits]
category: C4
flags: [3PF, XFER, PRE]
role: processor_or_3pf
lawful_basis: consent
provisions: ["s.6(1)", "s.8(2)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  A persistent distinct identifier, pages visited, events, IP address, browser
  details and user traits, sent to PostHog for product analytics.
destination_countries: [US, EU]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Stop firing; clear ph_* cookies and localStorage."
last_verified: "2026-09-15"
provenance: direct observation
