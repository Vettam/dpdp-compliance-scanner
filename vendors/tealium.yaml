id: tealium
vendor: Tealium
match:
  hosts: ["tags.tiqcdn.com", "cdn.tiqcdn.com", "tealium.com"]
  cookies: ["tealium_*", "utag_main"]
packages:
  npm: ["tealium"]
  pypi: ["tealium"]
data_points: [persistent_browser_id, page_url, event_name, ip_address, user_agent]
category: C1
flags: [PRE]
role: processor
lawful_basis: s7a
provisions: ["s.8(2)", "Rule 6(1)(b)", "Rule 6(1)(g)"]
notice_itemisation: >
  Page URL, IP address and browser details, loaded by Tealium to deploy other
  tags. Like GTM, it is a force multiplier and a breach vector if over-permissive.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Remove the tag; audit published tags and restrict publish permissions."
last_verified: "2026-09-15"
provenance: direct observation
