id: recaptcha
vendor: Google
match:
  hosts: ["www.google.com/recaptcha", "recaptcha.net", "www.gstatic.com/recaptcha"]
  cookies: ["_GRECAPTCHA"]
packages:
  npm: ["@google-cloud/recaptcha-enterprise"]
data_points: [device_signals, behavioural_signals, ip_address, user_agent]
category: C2
flags: [PROC, XFER, PRE, FP, DEC]
role: processor_or_3pf
lawful_basis: s7a
provisions: ["s.8(5)", "Rule 6(1)", "s.17(1)(c)"]
notice_itemisation: >
  Behavioural and device signals and your IP address, sent to reCAPTCHA for bot
  defence. Signals may be reused to train vendor models; confine to security
  necessity.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Remove the challenge; document the s.7(a)/s.17(1)(c) security basis."
last_verified: "2026-09-15"
provenance: direct observation
