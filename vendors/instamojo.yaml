id: instamojo
vendor: Instamojo
match:
  hosts: ["js.instamojo.com", "www.instamojo.com", "api.instamojo.com"]
  cookies: ["instamojo_*"]
data_points: [device_id, payment_metadata, ip_address, user_agent]
category: C8
flags: [3PF, XFER, SENS]
role: fiduciary
lawful_basis: s7a
provisions: ["s.16(2)", "s.8(2)", "s.8(5)", "Rule 6(1)"]
notice_itemisation: >
  Payment metadata, a device identifier, IP address and browser details, sent
  to Instamojo to complete a payment. RBI payment-data localisation survives
  under s.16(2).
destination_countries: [IN]
fires_pre_consent_by_default: false
withdrawal_mechanism: "Offload payment to Instamojo; do not retain card data yourself."
last_verified: "2026-09-17"
provenance: vendor documentation
