id: osano
vendor: Osano
match:
  hosts: ["cmp.osano.com", "osano.com"]
  cookies: ["osano"]
  storage_keys: ["osano"]
data_points: [consent_state, ip_address, user_agent]
category: C10
flags: [3PF, XFER, PRE]
role: processor
lawful_basis: s7a
provisions: ["s.6(10)", "s.8(2)", "Rule 3(c)"]
notice_itemisation: >
  Consent state and your IP address, recorded by Osano. The device-side
  consent cookie is not proof under s.6(10); the ledger must be under your
  control and exportable.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Reopen the banner; mirror the choice server-side."
last_verified: "2026-09-17"
provenance: vendor documentation
cmp:
  selectors:
    - ".osano-cm-window"
    - "#osano-cm-window"
    - ".osano-cm-dialog"
  accept_selectors:
    - ".osano-cm-accept-all"
    - ".osano-cm-confirm-button"
  reject_selectors:
    - ".osano-cm-denyAll"
    - ".osano-cm-deny"
