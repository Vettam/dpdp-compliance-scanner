id: rudderstack
vendor: RudderStack
match:
  hosts: ["cdn.rudderlabs.com", "api.rudderstack.com", "rudderstack.com"]
  cookies: ["rl_anonymous_id", "rl_user_id", "rl_group_id"]
packages:
  npm: ["@rudderstack/analytics-js", "@rudderstack/rudder-sdk-node", "rudder-sdk-js"]
  go: ["github.com/rudderlabs/analytics-go"]
  rubygems: ["rudder-sdk-ruby"]
data_points: [persistent_browser_id, page_url, event_name, ip_address, user_agent, traits]
category: C9
flags: [3PF, XFER, PRE]
role: processor
lawful_basis: consent
provisions: ["s.6(1)", "s.8(2)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  A persistent identifier, pages visited, events, IP address and browser
  details, and any user traits, sent to RudderStack which fans them out to
  your configured destinations.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Stop firing; clear rl_* cookies; suppress destinations."
last_verified: "2026-09-15"
provenance: direct observation
