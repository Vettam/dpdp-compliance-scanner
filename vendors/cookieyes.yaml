id: cookieyes
vendor: CookieYes (TermsFeed)
match:
  hosts: ["cdn-cookieyes.com", "cookieyes.com", "cdn-cookieyes.com"]
  cookies: ["cookieyes-consent", "cookielawinfo-checkbox-*", "viewed_cookie_policy"]
data_points: [consent_state, ip_address, user_agent]
category: C10
flags: [3PF, XFER, PRE]
role: processor
lawful_basis: s7a
provisions: ["s.6(10)", "s.8(2)", "Rule 3(c)"]
notice_itemisation: >
  Consent state and your IP address, recorded by CookieYes. The device-side
  consent cookie is not proof under s.6(10).
destination_countries: [US, IN]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Reopen the banner; mirror the choice server-side."
last_verified: "2026-09-17"
provenance: direct observation
cmp:
  selectors:
    - ".cky-consent-container"
    - "#cookie-law-info-bar"
    - ".cky-consent-bar"
  accept_selectors:
    - '[data-cky-tag="accept-button"]'
    - ".cky-btn-accept"
  reject_selectors:
    - '[data-cky-tag="reject-button"]'
    - ".cky-btn-reject"
