id: onetrust
vendor: OneTrust
match:
  hosts: ["cdn.cookielaw.org", "onetrust.com", "cdn.onetrust.com"]
  cookies: ["OptanonConsent", "OptanonAlertBoxClosed", "eupconsent-v2", "OTTask"]
data_points: [consent_state, ip_address, user_agent]
category: C10
flags: [3PF, XFER, PRE]
role: processor
lawful_basis: s7a
provisions: ["s.6(10)", "s.8(2)", "Rule 3(c)"]
notice_itemisation: >
  Consent state and your IP address, recorded by OneTrust. The device-side
  consent cookie is not proof under s.6(10); the ledger must be under your
  control and exportable.
destination_countries: [US]
fires_pre_consent_by_default: true
withdrawal_mechanism: "Reopen the banner; mirror the choice server-side."
last_verified: "2026-09-17"
provenance: direct observation
cmp:
  selectors:
    - "#onetrust-banner-sdk"
    - "#onetrust-consent-sdk"
    - ".ot-sdk-container"
  accept_selectors:
    - "#onetrust-accept-btn-handler"
  reject_selectors:
    - "#onetrust-reject-all-handler"
