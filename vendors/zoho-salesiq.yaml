id: zoho-salesiq
vendor: Zoho (SalesIQ)
match:
  hosts: ["salesiq.zoho.com", "salesiq.zoho.in", "js.zohocdn.com/salesiq"]
  cookies: ["salesiq_*", "zohosalesiq_*"]
data_points: [identity, message_content, page_context, ip_address, user_agent]
category: C7
flags: [3PF, XFER, SENS]
role: processor
lawful_basis: consent
provisions: ["s.6(1)", "s.8(2)", "s.11(1)(b)", "s.16"]
notice_itemisation: >
  Identity, message content and page context, plus IP address and browser
  details, sent to Zoho SalesIQ for live chat.
destination_countries: [IN, US]
fires_pre_consent_by_default: false
withdrawal_mechanism: "Stop firing; clear salesiq_* cookies."
last_verified: "2026-09-17"
provenance: vendor documentation
