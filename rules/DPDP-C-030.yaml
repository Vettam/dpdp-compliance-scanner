id: DPDP-C-030
title: Pseudonymous client identifier treated as personal data
certainty: arguable
enforceable_from: "2027-05-13"
observable: true
provisions:
  - s.2(t)
flags: [PII-LEAK]
categories: [C4, C6, C9]
owner: engineering
penalty_band: consent_notice
sources: [page]
detection:
  match: cookie
  where:
    cookie_name: "^(_ga|_ga_|_fbp|_fbc|_gid|_gcl_|IDE|FCC|PMD|__gads|__gpi)$"
needs_input: []
rationale_plain: >
  A cookie commonly used as a pseudonymous client identifier (_ga, _fbp, IDE,
  and similar) was observed. s.2(t) defines "personal data" as data by which a
  Data Principal is "identifiable … in relation to" the data. A pseudonymous
  identifier held by a vendor that also holds the mapping to the individual is
  personal data under DPDP; the GDPR-style "pseudonymised is not personal data"
  reading is arguable but not settled here, so the rule is tiered arguable.
rationale_dev: >
  Detection: a cookie whose name matches common analytics/advertising client
  identifiers. The hook is s.2(t)'s "in relation to" — the identifier may not
  name the person but, combined with the vendor's records, identifies them.
  Pair with C-010 to establish that the analytics is per-user, not aggregate.
remediation_summary: >
  Treat the identifier as personal data: obtain consent before setting it, or
  configure the vendor for aggregate-only statistics that do not set a
  client-side identifier.
explainer_url: https://sentinel.vettam.ai/rules/DPDP-C-030
since: "0.3.0"
changelog:
  - version: "0.3.0"
    date: "2026-09-17"
    note: Initial rule. Arguable tier; turns on s.2(t) "in relation to".
  - version: "0.6.0"
    date: "2026-10-15"
    note: Declared sources page. Detection is unchanged.
