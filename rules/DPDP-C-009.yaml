id: DPDP-C-009
title: We could not find a language option beyond English in the notice or banner
certainty: settled
enforceable_from: "2027-05-13"
observable: true
provisions:
  - s.5(3)
  - s.6(3)
flags: []
categories: []
owner: counsel
penalty_band: consent_notice
sources: [page]
detection:
  match: banner
  where:
    has_language_switcher: false
    page_language: en
needs_input: []
detection_confidence: low
rationale_plain: >
  We could not find a language option beyond English in the notice or banner.
  The Act requires that a person be given the option to access the notice in
  English or any of the 22 languages in the Eighth Schedule. A notice or
  banner offered only in English does not meet that requirement. Language
  choice may live elsewhere on the site, so this is a heuristic.
rationale_dev: >
  No language switcher was detected on the banner and the page language is
  English. s.5(3) and s.6(3) require the option of English or any Eighth
  Schedule language. This is a heuristic — a site may offer language choice
  elsewhere — so detection confidence is marked accordingly and the finding
  is phrased as "we could not find".
remediation_summary: >
  Offer the notice in English plus at least the relevant Eighth Schedule
  languages, with a visible language control.
explainer_url: https://sentinel.vettam.ai/rules/DPDP-C-009
since: "0.1.0"
changelog:
  - version: "0.1.0"
    date: "2026-09-15"
    note: Initial rule.
  - version: "0.4.0"
    date: "2026-09-17"
    note: Phrased as "we could not find" and forced detection_confidence to low, because language choice may live elsewhere.
  - version: "0.6.0"
    date: "2026-10-15"
    note: Declared sources page. Detection is unchanged.
